apiVersion: apps/v1
kind: Deployment
metadata:
  name: dq-import-worker
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: dq-import-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: dq-import-worker}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          image: dq-scoring:dev
          imagePullPolicy: Never
          command: [python, -m, dq_scoring.workers.import_daemon]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef: {name: dq-spark-config}
            - secretRef: {name: dq-scoring-worker-db}
          env:
            - name: DQ_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: {name: dq-minio-secret, key: access_key}
            - name: DQ_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: dq-minio-secret, key: secret_key}
            - name: DQ_IMPORT_TEMP_ROOT
              value: /scratch/imports
          resources:
            requests: {cpu: 100m, memory: 256Mi, ephemeral-storage: 1Gi}
            limits: {memory: 768Mi, ephemeral-storage: 45Gi}
          volumeMounts:
            - {name: scratch, mountPath: /scratch}
      volumes:
        - name: scratch
          emptyDir: {sizeLimit: 45Gi}
