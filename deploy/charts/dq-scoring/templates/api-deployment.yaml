{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dq-scoring.fullname" . }}-api
  labels:
    {{- include "dq-scoring.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "dq-scoring.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "dq-scoring.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      {{- if .Values.security.protectedProcessing.enabled }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        {{- if .Values.security.protectedProcessing.enabled }}
        seccompProfile:
          type: RuntimeDefault
        {{- end }}
      containers:
        - name: api
          {{- if .Values.security.protectedProcessing.enabled }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - uvicorn
            - dq_scoring.presentation.api.app:create_app
            - --factory
            - --host
            - 0.0.0.0
            - --port
            - "{{ .Values.api.port }}"
            {{- if .Values.security.protectedProcessing.enabled }}
            - --ssl-certfile
            - /opt/dq/security/tls.crt
            - --ssl-keyfile
            - /opt/dq/security/tls.key
            {{- end }}
          ports:
            - name: {{ include "dq-scoring.apiPortName" . }}
              containerPort: {{ .Values.api.port }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "dq-scoring.fullname" . }}-config
          env:
            - name: DQ_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret }}
                  key: {{ .Values.minio.accessKeyIdKey }}
            - name: DQ_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.minio.existingSecret }}
                  key: {{ .Values.minio.secretAccessKeyKey }}
            - name: DQ_AUTH_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.security.existingSecret | default (printf "%s-auth" (include "dq-scoring.fullname" .)) }}
                  key: {{ .Values.security.jwtSecretKey | default "jwt_secret" }}
            - name: DQ_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.apiDsnSecret }}
                  key: {{ .Values.postgres.dsnKey }}
            - name: DQ_IMPORT_TEMP_ROOT
              value: {{ if .Values.security.protectedProcessing.enabled }}"/opt/dq/scratch"{{ else }}"/scratch/imports"{{ end }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ include "dq-scoring.apiPortName" . }}
              {{- if .Values.security.protectedProcessing.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ include "dq-scoring.apiPortName" . }}
              {{- if .Values.security.protectedProcessing.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.security.protectedProcessing.enabled }}
            - name: scratch
              mountPath: /opt/dq/scratch
            - name: security
              mountPath: /opt/dq/security
              readOnly: true
            {{- else }}
            - name: scratch
              mountPath: /scratch
            {{- end }}
      volumes:
        {{- if .Values.security.protectedProcessing.enabled }}
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.security.protectedProcessing.apiScratchSizeLimit }}
        {{- include "dq-scoring.projectedSecurity" (dict "p" .Values.security.protectedProcessing "apiTls" true "spark" false) | nindent 8 }}
        {{- else }}
        - name: scratch
          emptyDir:
            sizeLimit: {{ required "api.scratchSizeLimit is required for disk-backed API scratch" .Values.api.scratchSizeLimit }}
        {{- end }}
{{- end }}
