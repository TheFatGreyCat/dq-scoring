{{- if not .Values.security.protectedProcessing.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "dq-scoring.fullname" . }}-spark-config
data:
  spark-defaults.conf: |
    spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID {{ .Values.minio.existingSecret }}:{{ .Values.minio.accessKeyIdKey }}
    spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY {{ .Values.minio.existingSecret }}:{{ .Values.minio.secretAccessKeyKey }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dq-scoring.fullname" . }}-spark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dq-scoring.fullname" . }}-spark
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps, persistentvolumeclaims]
    verbs: [create, get, list, watch, delete, deletecollection, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dq-scoring.fullname" . }}-spark
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dq-scoring.fullname" . }}-spark
subjects:
  - kind: ServiceAccount
    name: {{ include "dq-scoring.fullname" . }}-spark
    namespace: {{ .Release.Namespace }}
