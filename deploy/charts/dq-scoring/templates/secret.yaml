{{/*
Externally provisioned secrets guard.
Default credentials must never be rendered in manifests.
postgres.existingSecret, security.existingSecret, and minio.existingSecret are required.
*/}}
{{- if not .Values.postgres.existingSecret }}
{{- fail "postgres.existingSecret is required; rendering credential defaults in Helm is not permitted." }}
{{- end }}
{{- if not .Values.security.existingSecret }}
{{- fail "security.existingSecret is required; rendering credential defaults in Helm is not permitted." }}
{{- end }}
{{- if not .Values.minio.existingSecret }}
{{- fail "minio.existingSecret is required; rendering credential defaults in Helm is not permitted." }}
{{- end }}

{{- include "dq-scoring.protected.validate" . }}
