name: dq-spark

x-spark-service: &spark-service
  image: dq-scoring-spark:dev
  build:
    context: ../..
    dockerfile: Dockerfile.spark
  init: true
  restart: unless-stopped
  stop_grace_period: 60s
  networks: [spark]

x-worker-environment: &worker-environment
  SPARK_DAEMON_MEMORY: 256m
  SPARK_LOCAL_DIRS: /opt/spark/work-dir/local
  SPARK_WORKER_DIR: /opt/spark/work-dir/worker
  AWS_ACCESS_KEY_ID: ${DQ_S3_ACCESS_KEY_ID:?Required}
  AWS_SECRET_ACCESS_KEY: ${DQ_S3_SECRET_ACCESS_KEY:?Required}

services:
  spark-master:
    <<: *spark-service
    hostname: spark-master
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.master.Master, --host, spark-master, --port, '7077', --webui-port, '8080']
    environment:
      SPARK_DAEMON_MEMORY: 256m
    mem_limit: 512m
  spark-worker-1:
    <<: *spark-service
    hostname: spark-worker-1
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, --host, spark-worker-1, --cores, '4', --memory, 4g, 'spark://spark-master:7077']
    environment: *worker-environment
    mem_limit: 6144m
    volumes: [worker-1-work:/opt/spark/work-dir]
    depends_on: [spark-master]
  spark-worker-2:
    <<: *spark-service
    hostname: spark-worker-2
    command: [/opt/spark/bin/spark-class, org.apache.spark.deploy.worker.Worker, --host, spark-worker-2, --cores, '4', --memory, 4g, 'spark://spark-master:7077']
    environment: *worker-environment
    mem_limit: 6144m
    volumes: [worker-2-work:/opt/spark/work-dir]
    depends_on: [spark-master]
  evaluation-worker:
    <<: *spark-service
    hostname: evaluation-worker
    command: [python, -m, dq_scoring.workers.container_entrypoint]
    mem_limit: 3072m
    volumes:
      - driver-work:/opt/spark/work-dir
      - ${DQ_TEXT_DICTIONARY_DIR:-../../.tmp/text-dictionaries}:/opt/dq/text-dictionaries:ro
    depends_on: [spark-worker-1, spark-worker-2]
    environment:
      SPARK_LOCAL_DIRS: /opt/spark/work-dir/local
      DQ_TEXT_DICTIONARY_MANIFEST: /opt/dq/text-dictionaries/manifest.json
      DQ_WORKER_POSTGRES_DSN: ${DQ_WORKER_POSTGRES_DSN:?Required}
      DQ_WORKER_POSTGRES_HOST: postgres
      DQ_WORKER_POSTGRES_PORT: '5432'
      DQ_S3_ENDPOINT_URL: http://minio:9000
      DQ_S3_ACCESS_KEY_ID: ${DQ_S3_ACCESS_KEY_ID:?Required}
      DQ_S3_SECRET_ACCESS_KEY: ${DQ_S3_SECRET_ACCESS_KEY:?Required}
      DQ_S3_REGION: ${DQ_S3_REGION:-us-east-1}
      DQ_S3_BUCKET_STAGING: ${DQ_S3_BUCKET_STAGING:?Required}
      DQ_S3_BUCKET_SNAPSHOTS: ${DQ_S3_BUCKET_SNAPSHOTS:?Required}
      DQ_S3_BUCKET_ARTIFACTS: ${DQ_S3_BUCKET_ARTIFACTS:?Required}
      DQ_SPARK_DRIVER_MEMORY: 2g
      DQ_SPARK_DRIVER_MEMORY_OVERHEAD: 512m
      DQ_SPARK_EXECUTOR_MEMORY: 4g
      DQ_SPARK_EXECUTOR_MEMORY_OVERHEAD: 1024m
      DQ_SPARK_EXECUTOR_INSTANCES: '2'
      DQ_SPARK_EXECUTOR_CORES: '4'
      DQ_SPARK_MAX_MEMORY_MB: '16384'
      DQ_SPARK_SQL_SHUFFLE_PARTITIONS: '32'
      DQ_SPARK_MASTER: spark://spark-master:7077
      DQ_SPARK_DRIVER_HOST: evaluation-worker
      DQ_SPARK_DRIVER_PORT: '7078'
      DQ_SPARK_BLOCK_MANAGER_PORT: '7079'
      DQ_SPARK_MASTER_UI_URL: http://spark-master:8080

networks:
  spark:
    external: true
    name: ${DQ_SPARK_DOCKER_NETWORK:-dq_scoring_network}

volumes:
  worker-1-work:
  worker-2-work:
  driver-work:
