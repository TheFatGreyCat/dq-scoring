apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dq-scoring
  namespace: argocd
  labels:
    app.kubernetes.io/name: dq-scoring
    app.kubernetes.io/part-of: dq-scoring-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/org/dq-scoring.git
    targetRevision: HEAD
    path: deploy/charts/dq-scoring
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dq-scoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
