apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dq-staging
  namespace: argocd-staging
  labels:
    app.kubernetes.io/name: dq-scoring
    app.kubernetes.io/part-of: dq-scoring-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: git@github.com:TheFatGreyCat/dq-scoring.git
    targetRevision: overview-scratch-20261016
    path: deploy/charts/dq-scoring
    helm:
      releaseName: dq
      valueFiles:
        - values.yaml
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dq-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
