services:
  postgres:
    image: postgres:16
    container_name: dq-scoring-postgres
    environment:
      POSTGRES_DB: dq_scoring
      POSTGRES_USER: dq
      POSTGRES_PASSWORD: dq
    ports:
      - "5432:5432"
    volumes:
      - dq_scoring_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dq -d dq_scoring"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dq_scoring_pgdata:
