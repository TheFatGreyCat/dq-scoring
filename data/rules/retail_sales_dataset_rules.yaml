  - rule_id: DQ-ACCU-RETAIL-AGE-RANGE-001
    rule_name: Age must be between 0 and 120
    description: age must fall within a plausible customer age range
    dataset_id: retail_sales_dataset
    target_column: age
    dimension: Accuracy Proxy
    rule_type: plausibility_range
    parameters:
      min_value: 0
      max_value: 120
      value_format: numeric
    null_policy: ignore
    threshold: 99
    severity: medium
    execution_backend: pandas
    status: active
    score_enabled: true

  - rule_id: DQ-ACCU-RETAIL-QUANTITY-NONNEGATIVE-001
    rule_name: Quantity must be non-negative
    description: quantity must be greater than or equal to zero
    dataset_id: retail_sales_dataset
    target_column: quantity
    dimension: Accuracy Proxy
    rule_type: plausibility_range
