  - rule_id: DQ-CONS-RETAIL-TOTAL-AMOUNT-001
    rule_name: Total amount must match quantity times price
    description: total_amount must equal quantity multiplied by price_per_unit
    dataset_id: retail_sales_dataset
    dimension: Consistency
    rule_type: comparison
    parameters:
      left_column: total_amount
      right_expression:
        operator: multiply
        columns:
          - quantity
          - price_per_unit
      operator: eq
      tolerance: 0
      left_value_format: numeric
      value_formats:
        quantity: numeric
        price_per_unit: numeric
    null_policy: ignore
    threshold: 99
    severity: high
    execution_backend: pandas
    status: active
    score_enabled: true
