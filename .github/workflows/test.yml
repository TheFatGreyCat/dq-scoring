name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dq_scoring
          POSTGRES_USER: dq
          POSTGRES_PASSWORD: dq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dq -d dq_scoring"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DQ_DATABASE_URL: postgresql://dq:dq@localhost:5432/dq_scoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Migrate and bootstrap
        run: |
          . .venv/bin/activate
          python -m persistence.db migrate
          python -m dq_core.cli bootstrap_catalog
      - name: Run tests
        run: |
          . .venv/bin/activate
          python -m pytest tests -q