name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - uses: astral-sh/setup-uv@v5
        with: {version: "0.11.15", python-version: "3.13", enable-cache: true}
      - run: uv sync --locked --all-groups
      - name: Prepare isolated synthetic services
        env: {PYTHONPATH: src}
        run: |
          uv run --locked python scripts/setup_test_environment.py --prepare-env
          docker compose --env-file .tmp/e2e.env -p dq-e2e-test -f deploy/compose/test.yml up -d --wait
          uv run --locked python scripts/setup_test_environment.py --provision
      - run: uv run --locked ruff check src tests scripts
      - run: uv run --locked pytest -v
      - if: always()
        run: docker compose --env-file .tmp/e2e.env -p dq-e2e-test -f deploy/compose/test.yml down -v
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: oven-sh/setup-bun@v2
      - working-directory: frontend
        run: bun install --frozen-lockfile
      - working-directory: frontend
        run: bun run test && bun run typecheck && bun run build
